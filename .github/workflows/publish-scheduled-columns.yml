name: Publish scheduled columns

on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Activate articles whose publication date has arrived
        run: node tools/activate-scheduled-columns.cjs
      - name: Commit publication changes
        run: |
          if git diff --quiet; then
            echo "No scheduled articles to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add columns sitemap.xml
          git commit -m "Publish scheduled NexusM&A column"
          git push
